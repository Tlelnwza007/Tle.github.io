        // ---------- สวนญี่ปุ่นรอบบ้าน (B: หิน + สน + โคมไฟหิน) ----------
        // procedural ล้วน ไม่โหลดไฟล์เพิ่ม กันพังบน GitHub Pages
        // วางห่างตัวบ้าน (ครึ่งหลังกว้าง ~1.0) และเว้นทางเดินหน้าประตู z>0.8 ไว้
        // กล้องเดิน PATH_IN/OUT ผ่าน (0,~,0.6-5.0) จึงไม่วางของขวางแกน x∈[-0.6,0.6], z∈[0.5,5.2]
        (function buildJapaneseGarden() {
            const garden = new THREE.Group();
            garden.name = 'JapaneseGarden';
            scene.add(garden);
            const addShadow = (m) => { m.castShadow = true; m.receiveShadow = true; return m; };

            // โดมท้องฟ้าไล่สี (fog:false กันโดนหมอกกลบ)
            const skyGeo = new THREE.SphereGeometry(80, 16, 12);
            const skyMat = new THREE.ShaderMaterial({
                side: THREE.BackSide, depthWrite: false, fog: false,
                uniforms: {
                    top: { value: new THREE.Color(0x7fb8e6) },
                    bottom: { value: new THREE.Color(0xeef6fb) }
                },
                vertexShader: 'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
                fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying vec3 vP;' +
                    'void main(){ float h=normalize(vP).y*0.5+0.5; gl_FragColor=vec4(mix(bottom,top,smoothstep(0.02,0.5,h)),1.0); }'
            });
            garden.add(new THREE.Mesh(skyGeo, skyMat));

            // พื้นหญ้าใหญ่ + ลานกรวดรองใต้พื้นหินเดิม (กัน z-fight ด้วยระดับ y ต่างกัน)
            const grass = new THREE.Mesh(
                new THREE.PlaneGeometry(60, 60),
                new THREE.MeshStandardMaterial({ color: 0x7fa36b, roughness: 1, metalness: 0 })
            );
            grass.rotation.x = -Math.PI / 2; grass.position.y = -0.02; grass.receiveShadow = true;
            garden.add(grass);

            const gravel = new THREE.Mesh(
                new THREE.PlaneGeometry(16, 16),
                new THREE.MeshStandardMaterial({ color: 0xe8e2d4, roughness: 1, metalness: 0 })
            );
            gravel.rotation.x = -Math.PI / 2; gravel.position.y = -0.01; gravel.receiveShadow = true;
            garden.add(gravel);

            // หินก้าวทางเดิน จากหน้าประตูไปหน้าบ้าน (เว้นกลางไว้ให้กล้องเดิน)
            const stepMat = new THREE.MeshStandardMaterial({ color: 0xb8b5ae, roughness: 0.95, metalness: 0 });
            const steps = [
                [0, 1.5, 0.36], [0.16, 2.1, 0.33], [-0.14, 2.7, 0.36],
                [0.14, 3.3, 0.33], [-0.12, 3.9, 0.35], [0, 4.5, 0.36], [0, 5.1, 0.38]
            ];
            steps.forEach(([x, z, r], i) => {
                const s = addShadow(new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.06, 0.08, 7), stepMat));
                s.position.set(x, 0.04, z); s.rotation.y = i * 0.45; garden.add(s);
            });

            // กลุ่มหินประดับ (เลี่ยงทางเดินกลาง)
            const rockMat = new THREE.MeshStandardMaterial({ color: 0x9a9a98, roughness: 1, metalness: 0 });
            const rocks = [
                [-2.5, 2.5, 0.45], [-2.9, 2.1, 0.28], [-2.1, 2.8, 0.22],
                [2.4, 1.8, 0.5], [2.8, 2.3, 0.26],
                [-2.3, -1.6, 0.4], [-2.7, -1.1, 0.24],
                [2.6, -1.3, 0.42], [3.0, -0.8, 0.25]
            ];
            rocks.forEach(([x, z, r], i) => {
                const rock = addShadow(new THREE.Mesh(new THREE.DodecahedronGeometry(r, 0), rockMat));
                rock.position.set(x, r * 0.45, z);
                rock.rotation.set(i * 1.1, i * 2.3, i * 0.7);
                rock.scale.y = 0.65; garden.add(rock);
            });

            // สนญี่ปุ่น: ลำต้น + ใบ 3 ชั้น (โคนแบน)
            function makePine(scale) {
                const g = new THREE.Group();
                const trunk = addShadow(new THREE.Mesh(
                    new THREE.CylinderGeometry(0.09 * scale, 0.14 * scale, 1.1 * scale, 7),
                    new THREE.MeshStandardMaterial({ color: 0x6b4a2f, roughness: 1 })
                ));
                trunk.position.y = 0.55 * scale; g.add(trunk);
                const leafMat = new THREE.MeshStandardMaterial({ color: 0x3f6b3a, roughness: 1 });
                [[1.0, 1.25], [0.75, 1.7], [0.48, 2.1]].forEach(([r, y]) => {
                    const leaf = addShadow(new THREE.Mesh(new THREE.ConeGeometry(r * scale, 0.7 * scale, 8), leafMat));
                    leaf.position.y = y * scale; g.add(leaf);
                });
                return g;
            }
            [[-3.5, -0.5, 1.25], [3.6, -0.8, 1.1], [-3.1, 3.6, 0.85]].forEach(([x, z, s]) => {
                const pine = makePine(s); pine.position.set(x, 0, z); pine.rotation.y = x; garden.add(pine);
            });

            // พุ่มมอสทรงกลมแปะข้างบ้าน
            const mossMat = new THREE.MeshStandardMaterial({ color: 0x5a7d4f, roughness: 1 });
            [[-1.7, 0.9, 0.3], [1.7, 0.7, 0.34], [-1.7, -0.9, 0.26], [1.75, -0.9, 0.3],
             [-1.4, 3.4, 0.24], [1.5, 3.5, 0.26]].forEach(([x, z, r]) => {
                const b = addShadow(new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), mossMat));
                b.position.set(x, r * 0.8, z); b.scale.y = 0.8; garden.add(b);
            });

            // โคมไฟหิน: ฐาน+เสา+ห้องไฟ+หลังคาพีระมิด+ยอด
            function makeStoneLantern() {
                const g = new THREE.Group();
                const stone = new THREE.MeshStandardMaterial({ color: 0xcac5bb, roughness: 0.9 });
                const base = addShadow(new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.14, 0.42), stone));
                base.position.y = 0.07; g.add(base);
                const pillar = addShadow(new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.5, 8), stone));
                pillar.position.y = 0.39; g.add(pillar);
                const firebox = addShadow(new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.26, 0.32), stone));
                firebox.position.y = 0.77; g.add(firebox);
                const glow = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.14, 0.2),
                    new THREE.MeshStandardMaterial({ color: 0xfff2cf, emissive: 0xffc46b, emissiveIntensity: 0.9 }));
                glow.position.y = 0.77; g.add(glow);
                const roof = addShadow(new THREE.Mesh(new THREE.ConeGeometry(0.36, 0.22, 4), stone));
                roof.position.y = 1.01; roof.rotation.y = Math.PI / 4; g.add(roof);
                const jewel = addShadow(new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), stone));
                jewel.position.y = 1.16; g.add(jewel);
                const lamp = new THREE.PointLight(0xffd9a0, 0.35, 3, 2);
                lamp.position.y = 0.8; g.add(lamp);
                return g;
            }
            [[1.15, 2.2], [-1.15, 2.9]].forEach(([x, z]) => {
                const l = makeStoneLantern(); l.position.set(x, 0, z); garden.add(l);
            });

            // รั้วไม้ไผ่เตี้ยรูปตัว U (เว้นด้านหน้าทางเดินไว้)
            const bambooMat = new THREE.MeshStandardMaterial({ color: 0xc2a878, roughness: 0.9 });
            function fenceRun(x0, z0, x1, z1) {
                const len = Math.hypot(x1 - x0, z1 - z0);
                const n = Math.max(2, Math.round(len / 0.8));
                for (let i = 0; i <= n; i++) {
                    const post = addShadow(new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.9, 6), bambooMat));
                    post.position.set(x0 + (x1 - x0) * i / n, 0.45, z0 + (z1 - z0) * i / n);
                    garden.add(post);
                }
                [0.65, 0.35].forEach((h) => {
                    const rail = addShadow(new THREE.Mesh(new THREE.BoxGeometry(len, 0.05, 0.05), bambooMat));
                    rail.position.set((x0 + x1) / 2, h, (z0 + z1) / 2);
                    rail.rotation.y = -Math.atan2(z1 - z0, x1 - x0);
                    garden.add(rail);
                });
            }
            fenceRun(-4, -4, 4, -4); fenceRun(-4, -4, -4, 4); fenceRun(4, -4, 4, 4);

            // เมฆนุ่มๆ 3 ก้อน ลอยช้าๆ (ขยับแค่ตำแหน่ง ไม่ render ซ้ำ)
            const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });
            const clouds = [];
            [[-8, 12, -14], [6, 14, -18], [0, 11, 14]].forEach(([x, y, z]) => {
                const c = new THREE.Group();
                for (let i = 0; i < 3; i++) {
                    const s = new THREE.Mesh(new THREE.SphereGeometry(1.2 - i * 0.2, 10, 8), cloudMat);
                    s.position.set(i * 1.3 - 1.3, i % 2 * 0.3, 0); s.scale.y = 0.6; c.add(s);
                }
                c.position.set(x, y, z); garden.add(c); clouds.push(c);
            });
            (function drift() {
                clouds.forEach((c, i) => {
                    c.position.x += 0.003 + i * 0.001;
                    if (c.position.x > 14) c.position.x = -14;
                });
                requestAnimationFrame(drift);
            })();
        })();


        // ---------- สีบ้าน / กระจก / ของตกแต่ง ----------
        // (ค่าพิกัดทั้งหมดวัดจาก HOME.glb ที่ export ออกมา หน่วยเมตร)

        const COLOR_OUTSIDE = 0xF2A2B8;    // ชมพูอมชมพู = ด้านนอกบ้าน
        const COLOR_INSIDE = 0x8FC1E3;     // ฟ้าอมฟ้า = ด้านในบ้าน
        const COLOR_TRIM = 0xF5EFE2;       // ครีม = ประตู / กรอบกระจก
        const COLOR_FURNITURE = 0xD9D9D9;  // เทาอ่อน = เคาน์เตอร์ข้างผนัง
        const COLOR_GLASS = 0xBFE9F5;      // กระจกสีฟ้าอ่อน

        // จุดกึ่งกลางห้อง ใช้ตัดสินว่าผิวของสามเหลี่ยมหันเข้าหาห้องหรือหันออกนอก
        // จุดกึ่งกลางห้อง ใช้เป็นจุดอ้างอิงตำแหน่งกล้องและไฟภายใน
        const ROOM_CENTER = new THREE.Vector3(0, 1.42, 0);

        // กรอบช่องกระจกในผนังข้าง โมเดลเดิมไม่ได้เจาะรู แต่มีกลุ่มสามเหลี่ยม 4 ใบ
        // วางเป็นรูปหกเหลี่ยมพอดีตรงนี้ (ใช้ตัดสามเหลี่ยมทิ้ง แล้วคัดลอกเป็นกระจก)
        const WINDOW_HOLE = { y0: 0.613, y1: 1.435, z0: -0.099, z1: 0.091 };
        const WINDOW_OUTLINE = [
            [1.435, -0.004], [1.340, 0.091], [0.708, 0.091],
            [0.613, -0.004], [0.708, -0.099], [1.340, -0.099]
        ];

        // แผ่นแบนหลายเหลี่ยมในระนาบ x = ค่าคงที่ รับรายการจุดแบบ [y, z]
        function flatShape(points, x) {
            const pos = [];
            for (let i = 1; i < points.length - 1; i++) {
                pos.push(x, points[0][0], points[0][1]);
                pos.push(x, points[i][0], points[i][1]);
                pos.push(x, points[i + 1][0], points[i + 1][1]);
            }
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            g.computeVertexNormals();
            return g;
        }

        // กรอบวงแหวนบาง ๆ ระหว่างรูปเดิมกับรูปที่ขยายออกจากจุดกึ่งกลาง
        // ใช้ปิดรอยตัดของผนังให้เป็นกรอบหน้าต่างสวย ๆ
        function flatRing(points, x, scale) {
            let cy = 0, cz = 0;
            for (const p of points) { cy += p[0]; cz += p[1]; }
            cy /= points.length;
            cz /= points.length;
            const pos = [];
            for (let i = 0; i < points.length; i++) {
                const j = (i + 1) % points.length;
                const a = points[i], b = points[j];
                const oa = [cy + (a[0] - cy) * scale, cz + (a[1] - cz) * scale];
                const ob = [cy + (b[0] - cy) * scale, cz + (b[1] - cz) * scale];
                pos.push(x, a[0], a[1], x, b[0], b[1], x, ob[0], ob[1]);
                pos.push(x, a[0], a[1], x, ob[0], ob[1], x, oa[0], oa[1]);
            }
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            g.computeVertexNormals();
            return g;
        }

        // ลงสีเปลือกบ้านสองด้าน + เจาะช่องกระจก
        // เปลือกบ้านเป็นผนังบาง ๆ ที่มีแต่ผิวด้านเดียว (material เดิมเป็น doubleSided)
        // วิธีทำ "นอกชมพู / ในฟ้า" คือคัดลอกจุดของเปลือกออกมาอีกชุด
        // แล้วสลับลำดับจุด + กลับเวกเตอร์ปกติ เวลานี้สามเหลี่ยมชุดที่สอง
        // จะหันหน้าเข้าหาผู้ที่อยู่ข้างในบ้าน และรับแสงไฟจากข้างในได้ด้วย
        // (สำคัญมาก: three.js คิดแสงจาก attribute normal ไม่ใช่จากทิศวงปิด
        //  ถ้าใช้จุดชุดเดียวกัน ปกติจะยังชี้ออกนอก ไฟข้างในจะส่องผิวด้านในไม่ได้เลย)
        // คืนจำนวนสามเหลี่ยมที่ถูกเจาะออก เพื่อเอาไปตรวจว่าตรงกับโมเดลไหม
        function paintHouseShell(mesh) {
            if (!mesh) return 0;
            const geometry = mesh.geometry;
            const position = geometry.getAttribute('position');
            if (!position) return 0;
            if (!geometry.getIndex()) {
                geometry.setIndex(Array.from({ length: position.count }, (_, i) => i));
            }
            if (!geometry.getAttribute('normal')) geometry.computeVertexNormals();
            const normal = geometry.getAttribute('normal');
            const uv = geometry.getAttribute('uv');
            const idx = geometry.getIndex().array;

            // ค่าพิกัดข้างล่างทั้งหมดเป็นพิกัดโลก (world) แต่ vertex ในไฟล์ .glb เป็นพิกัด local
            // node ของบ้านมี translation/scale คนละชุด จึงต้องแปลงก่อนเทียบทุกครั้ง
            mesh.updateWorldMatrix(true, false);
            const toWorld = mesh.matrixWorld;

            const a = new THREE.Vector3();
            const b = new THREE.Vector3();
            const c = new THREE.Vector3();
            const ab = new THREE.Vector3();
            const ac = new THREE.Vector3();
            const mid = new THREE.Vector3();

            // เก็บสามเหลี่ยมที่ใช้จริง ตามลำดับจุดเดิม (ชุดนอก = ชมพู)
            const kept = [];
            let cut = 0;

            for (let i = 0; i < idx.length; i += 3) {
                a.fromBufferAttribute(position, idx[i]);
                b.fromBufferAttribute(position, idx[i + 1]);
                c.fromBufferAttribute(position, idx[i + 2]);
                mid.copy(a).add(b).add(c).multiplyScalar(1 / 3).applyMatrix4(toWorld);

                // เจาะช่องกระจก: ตัดเฉพาะสามเหลี่ยมที่อยู่บนระนาบผนังข้าง
                // และมีจุดกึ่งกลางอยู่ในกรอบช่อง (โมเดลเดิมปิดรูนี้ไว้เป็นผนังเหมือนกัน)
                if (Math.abs(Math.abs(mid.x) - 1) < 0.002 &&
                    mid.y > WINDOW_HOLE.y0 + 1e-4 && mid.y < WINDOW_HOLE.y1 - 1e-4 &&
                    mid.z > WINDOW_HOLE.z0 + 1e-4 && mid.z < WINDOW_HOLE.z1 - 1e-4) {
                    cut++;
                    continue;
                }

                ab.copy(b).sub(a);
                ac.copy(c).sub(a);
                // เส้นเป็ด (พื้นที่เป็นศูนย์) ไม่ต้องวาด
                if (Math.abs(ab.x * ac.y - ab.y * ac.x) +
                    Math.abs(ab.y * ac.z - ab.z * ac.y) +
                    Math.abs(ab.z * ac.x - ab.x * ac.z) < 1e-12) continue;

                kept.push(idx[i], idx[i + 1], idx[i + 2]);
            }

            // ต่อท้ายจุดชุดใหม่ (ปกติกลับด้าน) ต่อจากจุดเดิม
            const vCount = position.count;
            const nTri = kept.length / 3;
            const totalV = vCount + nTri * 3;
            const posOut = new Float32Array(totalV * 3);
            const nrmOut = new Float32Array(totalV * 3);
            const uvOut = uv ? new Float32Array(totalV * 2) : null;
            posOut.set(position.array);
            nrmOut.set(normal.array);
            if (uvOut) uvOut.set(uv.array);

            const outsideIdx = [];   // ชี้ไปที่จุดเดิม
            const insideIdx = [];    // ชี้ไปที่จุดชุดใหม่ และสลับลำดับ
            for (let t = 0; t < nTri; t++) {
                const i0 = kept[t * 3], i1 = kept[t * 3 + 1], i2 = kept[t * 3 + 2];
                outsideIdx.push(i0, i1, i2);
                const d0 = vCount + t * 3;
                for (let k = 0; k < 3; k++) {
                    const src = kept[t * 3 + k];
                    posOut[(d0 + k) * 3] = position.array[src * 3];
                    posOut[(d0 + k) * 3 + 1] = position.array[src * 3 + 1];
                    posOut[(d0 + k) * 3 + 2] = position.array[src * 3 + 2];
                    nrmOut[(d0 + k) * 3] = -normal.array[src * 3];
                    nrmOut[(d0 + k) * 3 + 1] = -normal.array[src * 3 + 1];
                    nrmOut[(d0 + k) * 3 + 2] = -normal.array[src * 3 + 2];
                    if (uvOut) {
                        uvOut[(d0 + k) * 2] = uv.array[src * 2];
                        uvOut[(d0 + k) * 2 + 1] = uv.array[src * 2 + 1];
                    }
                }
                insideIdx.push(d0, d0 + 2, d0 + 1);   // สลับลำดับจุด = หันหน้าเข้าห้อง
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(posOut, 3));
            geometry.setAttribute('normal', new THREE.BufferAttribute(nrmOut, 3));
            if (uvOut) geometry.setAttribute('uv', new THREE.BufferAttribute(uvOut, 2));

            const shell = (color) => new THREE.MeshStandardMaterial({
                color: color, roughness: 0.5, metalness: 0, side: THREE.FrontSide
            });

            // เรียง index เป็น 2 กลุ่มติดกัน แล้วผูกวัสดุของแต่ละกลุ่ม
            const nFront = outsideIdx.length;
            geometry.setIndex(outsideIdx.concat(insideIdx));
            geometry.groups.length = 0;   // ล้างกลุ่มเดิมก่อน แล้วค่อยแบ่งใหม่
            geometry.addGroup(0, nFront, 0);
            geometry.addGroup(nFront, insideIdx.length, 1);
            geometry.computeBoundingSphere();   // จุดเพิ่มขึ้น ต้องคำนวณขอบเขตใหม่
            mesh.material = [
                shell(COLOR_OUTSIDE),   // 0 ปกติชี้ออกนอก = มองเห็นจากข้างนอก
                shell(COLOR_INSIDE)     // 1 ปกติชี้เข้าใน = มองเห็นจากข้างใน
            ];

            // ให้เปลือกบ้านกาดเงาและรับเงา
            // เดิมไม่กาดเงา แสงอาทิตย์จึงทะลุหลังคาเข้ามาเต็ม ๆ ผิวด้านในได้ E เพิ่มอีก 0.35
            // ทำให้ห้องสว่างเกินจนซีด พอกาดเงาแล้วหลังคาจะบังแดดได้ตามจริง
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return cut;
        }

        // ใส่กระจกสี + กรอบหน้าต่างที่ช่องที่เจาะไว้ ทั้งสองข้างของบ้าน
        function buildWindows() {
            const glass = new THREE.MeshPhysicalMaterial({
                color: COLOR_GLASS,
                transparent: true,
                opacity: 0.35,
                roughness: 0.05,
                metalness: 0,
                side: THREE.DoubleSide,
                depthWrite: false
            });
            const frame = new THREE.MeshStandardMaterial({
                color: COLOR_TRIM, roughness: 0.6, metalness: 0, side: THREE.DoubleSide
            });
            [1, -1].forEach((s) => {
                scene.add(new THREE.Mesh(flatShape(WINDOW_OUTLINE, s), glass));
                scene.add(new THREE.Mesh(flatRing(WINDOW_OUTLINE, s * 0.997, 1.07), frame));
                scene.add(new THREE.Mesh(flatRing(WINDOW_OUTLINE, s * 1.003, 1.07), frame));
            });
        }

        //โหลดโมเดล HOME.glb
        let homeModel = null;
        let doorMesh = null;
        const loader = new THREE.GLTFLoader();
        loader.load('./Modle3D/HOME.glb', (gltf) => {
            homeModel = gltf.scene;
            scene.add(homeModel);

            // หาประตู = แผ่นแบน (บางมากในแกน Z) ที่อยู่ด้านหน้าบ้าน
            // วิธีนี้ไม่ต้องพึ่งชื่อ node ที่ GLTFLoader ตั้งให้ จึงไม่พังถ้าโมเดลถูก export ใหม่
            const bbox = new THREE.Box3();
            const size = new THREE.Vector3();
            const center = new THREE.Vector3();
            homeModel.updateMatrixWorld(true);
            homeModel.traverse((obj) => {
                if (!obj.isMesh) return;
                obj.geometry.computeBoundingBox();
                bbox.copy(obj.geometry.boundingBox).applyMatrix4(obj.matrixWorld);
                bbox.getSize(size);
                bbox.getCenter(center);
                if (size.z < 0.02 && center.z > 0.8) {
                    doorMesh = obj;
                }
            });

            // เปลือกบ้าน = mesh ที่มีสามเหลี่ยมเยอะที่สุด (ตัวประตูมีแค่ 12 ใบ)
            let shellMesh = null;
            let mostTriangles = -1;
            homeModel.traverse((obj) => {
                if (!obj.isMesh || obj === doorMesh) return;
                const g = obj.geometry;
                const triangles = (g.index ? g.index.count : g.attributes.position.count) / 3;
                if (triangles > mostTriangles) {
                    mostTriangles = triangles;
                    shellMesh = obj;
                }
            });

            const cut = paintHouseShell(shellMesh);

            // ประตูกับเคาน์เตอร์ไม่ได้ใส่ material มากับไฟล์ .glb ต้องกำหนดเอง
            homeModel.traverse((obj) => {
                if (!obj.isMesh || obj === shellMesh) return;
                obj.material = new THREE.MeshStandardMaterial({
                    color: obj === doorMesh ? COLOR_TRIM : COLOR_FURNITURE,
                    roughness: obj === doorMesh ? 0.55 : 0.7,
                    metalness: 0,
                    side: THREE.DoubleSide
                });
            });

            // เจาะได้ครบ 8 ใบ (4 ใบต่อข้าง) = ตรงกับโมเดลที่วัดมา ค่อยใส่กระจก
            if (cut === 8) {
                buildWindows();
            } else {
                console.warn('เจาะช่องกระจกได้ ' + cut + ' ใบ ไม่ตรงกับที่คาดไว้ (8) ข้ามการใส่กระจก');
            }

            console.log(doorMesh ? 'โหลด HOME.glb สำเร็จ พบประตูแล้ว' : 'โหลด HOME.glb สำเร็จ แต่ไม่พบประตู');
        }, undefined, (error) => {
            console.error('โหลด HOME.glb ไม่สำเร็จ:', error);
        });


        // ---------- ป้าย NewT.glb ติดอยู่บนผนังหลัง (แทน Text.glb เดิม) ----------
        // ใช้ rotation ดั้งเดิมในไฟล์ (baked +90° X = ท่าที่ author วางมา: ตั้งตรงหัน +Z)
        // ผนังหลังอยู่ที่ z = -1.200 เลยยึด "หลังสุด" ของป้ายไว้ห่างผนัง 15 มม.
        const TEXT_WIDTH = 1.4;      // ความกว้างป้าย (เมตร)
        const TEXT_CENTER_X = 0;     // กึ่งกลางแนวนอนบนผนัง
        const TEXT_CENTER_Y = 1.42;  // ระดับสายตา
        const TEXT_WALL_Z = -1.185;  // หลังสุดของป้าย (ด้านติดผนัง)

        new THREE.GLTFLoader().load('./NewT.glb', (gltf) => {
            const textRoot = gltf.scene;
            // ใช้ rotation ดั้งเดิมในไฟล์ (baked +90° X = ท่าตั้งตรงที่ author วางมา)
            // ห้าม override เป็น -90° X และห้าม wrap.rotation.x = PI (ทั้งคู่ทำให้กลับหัว)
            const wrap = new THREE.Group();
            wrap.add(textRoot);
            scene.add(wrap);
            wrap.updateMatrixWorld(true);

            // วัดขนาดจริง แล้วค่อย scale ให้ได้ความกว้างตามที่ต้องการ
            const box = new THREE.Box3();
            const boxSize = new THREE.Vector3();
            wrap.scale.setScalar(TEXT_WIDTH / box.setFromObject(wrap).getSize(boxSize).x);
            wrap.updateMatrixWorld(true);
            box.setFromObject(wrap);

            // เลื่อนให้กึ่งกลางแนวนอน/แนวตั้งตรงที่เลือกไว้ และให้หลังสุดชิดผนัง (หน้าลอยเข้าหาห้อง)
            const mid = box.getCenter(new THREE.Vector3());
            wrap.position.x += TEXT_CENTER_X - mid.x;
            wrap.position.y += TEXT_CENTER_Y - mid.y;
            wrap.position.z += TEXT_WALL_Z - box.min.z;

            // NewT.glb มี material ทองติดมาแล้ว เก็บไว้ เติมเฉพาะ mesh ที่ไม่มี material
            textRoot.traverse((obj) => {
                if (!obj.isMesh || obj.material) return;
                obj.material = new THREE.MeshStandardMaterial({
                    color: 0xFFF4F6, roughness: 0.55, metalness: 0, side: THREE.DoubleSide
                });
            });

            console.log('โหลด NewT.glb สำเร็จ');
        }, undefined, (error) => {
            console.error('โหลด NewT.glb ไม่สำเร็จ:', error);
        });


        // ---------- p.glb แขวนผนังหลัง เหนือป้าย NewT ----------
        // ใช้ rotation ดั้งเดิมในไฟล์ ผนังหลังหันหน้า +Z อยู่แล้วจึงไม่ต้องหัน Y
        // ป้ายกว้าง 1.4 สูง ~0.37 ขอบบน ~1.61 กลางผนังเป็นจั่วสูงเลยใส่ 0.45 ได้
        // วางกลาง y=1.88 (ขอบล่าง ~1.655 ห่างป้าย ~4cm ขอบบน ~2.10 อยู่บนจั่ว)
        const P_W = 0.45;   // ความกว้างรูป (เมตร)
        const P_POS = { x: 0, y: 1.88, z: -1.18 };  // z = หลังสุดห่างผนังหลัง ~20 มม.

        // รูปที่จะแปะบน p.glb (ไฟล์เดียวกับรูปในกรอบผนังข้าง)
        const TEX_P_FILE = './825308342_1798623664624818_3759687659768814787_n.jpg';
        const pPhotoMats = [];   // material ของ p ที่รอแปะรูป (กัน race โหลดไม่พร้อมกัน)
        const texP = new THREE.TextureLoader().load(
            TEX_P_FILE,
            () => {
                console.log('โหลดรูป p.glb สำเร็จ:', TEX_P_FILE,
                    'ขนาดรูป=', texP.image ? texP.image.naturalWidth + 'x' + texP.image.naturalHeight : 'ไม่มี image');
                // รูปพร้อมแล้วค่อยแปะเข้า material ที่สร้างไว้ แล้วบังคับอัปเดต
                pPhotoMats.forEach((m) => { m.map = texP; m.needsUpdate = true; });
            },
            undefined,
            (error) => console.error('โหลดรูป p.glb ไม่สำเร็จ:', TEX_P_FILE, error)
        );
        // กันรูป NPOT (500x631) อัปโหลดดำบน WebGL1: ไม่ใช้ mipmap + filter linear
        texP.minFilter = THREE.LinearFilter;
        texP.generateMipmaps = false;

        new THREE.GLTFLoader().load('./p.glb', (gltf) => {
            const pRoot = gltf.scene;
            // ใช้ rotation ดั้งเดิมในไฟล์ (baked +90° X) ห้าม override
            const pWrap = new THREE.Group();
            pWrap.add(pRoot);
            scene.add(pWrap);
            pWrap.updateMatrixWorld(true);

            const pBox = new THREE.Box3();
            const pSize = new THREE.Vector3();
            // ไม่หัน Y แล้ว ความกว้างอยู่แกน X
            pWrap.scale.setScalar(P_W / pBox.setFromObject(pWrap).getSize(pSize).x);
            pWrap.updateMatrixWorld(true);
            pBox.setFromObject(pWrap);

            // หลังสุด (min.z) ชิดผนังหลัง กึ่งกลาง x/y ตามที่เลือก
            const pMid = pBox.getCenter(new THREE.Vector3());
            pWrap.position.x += P_POS.x - pMid.x;
            pWrap.position.y += P_POS.y - pMid.y;
            pWrap.position.z += P_POS.z - pBox.min.z;

            // ไฟล์นี้ไม่มี material ใส่ material รูปแบบไม่รับแสง (เห็นสีจริง ไม่ขึ้นกับไฟห้อง)
            // แปะ map ถ้ารูปพร้อมแล้ว ถ้ารูปยังโหลดไม่เสร็จ onLoad ข้างบนจะมาแปะให้เอง
            pRoot.traverse((obj) => {
                if (!obj.isMesh || obj.material) return;
                const pm = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
                if (texP.image) { pm.map = texP; pm.needsUpdate = true; }
                obj.material = pm;
                pPhotoMats.push(pm);
            });

            console.log('โหลด p.glb สำเร็จ');
        }, undefined, (error) => {
            console.error('โหลด p.glb ไม่สำเร็จ:', error);
        });


        // ---------- Paiy.glb ข้างบ้านด้านซ้าย (นอกบ้าน) ----------
        // ไฟล์วางตำแหน่งมาเองแล้ว (x≈-2, z≈1.66 หน้าบ้านเยื้องซ้าย) มี 2 node
        // (Plane.001 + Text.001) บิด +90° X ทั้งคู่ แค่แก้ rotation ไม่จัดตำแหน่งใหม่
        new THREE.GLTFLoader().load('./Paiy.glb', (gltf) => {
            const paiy = gltf.scene;
            // ใช้ rotation + ตำแหน่งดั้งเดิมในไฟล์ (author วางข้างบ้านมาแล้ว) ห้าม override
            scene.add(paiy);

            // Text.001 มี material ทองติดมาแล้ว เก็บไว้ เติมเฉพาะ mesh ที่ไม่มี (Plane.001)
            paiy.traverse((obj) => {
                if (!obj.isMesh || obj.material) return;
                obj.material = new THREE.MeshStandardMaterial({
                    color: 0xFFF4F6, roughness: 0.6, metalness: 0, side: THREE.DoubleSide
                });
            });

            console.log('โหลด Paiy.glb สำเร็จ');
        }, undefined, (error) => {
            console.error('โหลด Paiy.glb ไม่สำเร็จ:', error);
        });


        // ---------- รูปในกรอบ แขวนบนผนังข้าง ----------
        const PHOTO_FILE = './825308342_1798623664624818_3759687659768814787_n.jpg';
        const PHOTO_W = 0.4;    // สัดส่วนภาพต้นฉบับ 500 x 631
        const PHOTO_H = 0.505;
        const PHOTO_POS = new THREE.Vector3(0.995, 1.6, -0.75);

        // ไม่ตั้ง texture.encoding ให้เข้ากับฉากเดิม (renderer ไม่ได้เปิด outputEncoding
        // ถ้าตั้ง sRGB เฉพาะรูปนี้ ภาพจะเข้มกว่าส่วนอื่นของฉาก)
        // ใส่ onError ไว้ด้วย เผื่อไฟล์ยังไม่ได้ push ขึ้น GitHub Pages แล้วโหลดไม่ขึ้น
        const texPhoto = new THREE.TextureLoader().load(
            PHOTO_FILE,
            () => console.log('โหลดรูปภาพสำเร็จ:', PHOTO_FILE),
            undefined,
            (error) => console.error('โหลดรูปภาพไม่สำเร็จ:', PHOTO_FILE, error)
        );
        // กันรูป NPOT อัปโหลดดำ (แบบเดียวกับ texP)
        texPhoto.minFilter = THREE.LinearFilter;
        texPhoto.generateMipmaps = false;

        // โครงรูป วางถอยเข้าไปในผนัง 3 มม. กันภาพทับซ้อนกระพริบ
        const photoFrame = new THREE.Mesh(
            new THREE.PlaneGeometry(PHOTO_W + 0.04, PHOTO_H + 0.04),
            new THREE.MeshStandardMaterial({
                color: COLOR_TRIM, roughness: 0.6, metalness: 0, side: THREE.DoubleSide
            })
        );
        photoFrame.position.set(PHOTO_POS.x - 0.003, PHOTO_POS.y, PHOTO_POS.z);
        photoFrame.rotation.y = -Math.PI / 2; // หันเข้าหาห้อง
        scene.add(photoFrame);

        const photo = new THREE.Mesh(
            new THREE.PlaneGeometry(PHOTO_W, PHOTO_H),
            // รูปโชว์ใช้แบบไม่รับแสง (สีจริง ไม่ขึ้นกับไฟห้อง)
            new THREE.MeshBasicMaterial({ map: texPhoto, side: THREE.DoubleSide })
        );
        photo.position.copy(PHOTO_POS);
        photo.rotation.y = -Math.PI / 2;
        scene.add(photo);

        // ---------- ตกแต่งในบ้านสไตล์ญี่ปุ่นมินิมอล (A) ----------
        // ห้องเล็ก (~2x2.4m) กล้องในบ้านมองจาก (0,1.3,0.8) ไปผนังหลัง ของทุกชิ้นเตี้ยกว่า 0.5m
        // กันบังป้าย NewT (y~1.23-1.61) / รูป p (y~1.66+) / กรอบรูปข้าง (y~1.6)
        (function buildJapaneseInterior() {
            const inner = new THREE.Group();
            inner.name = 'JapaneseInterior';
            scene.add(inner);
            const solid = (m) => { m.castShadow = true; m.receiveShadow = true; return m; };

            // เสื่อทาทามิ 2 ผืน (y=0.006 กัน z-fight กับพื้น) กลางห้อง z~-0.15
            const strawMat = new THREE.MeshStandardMaterial({ color: 0xd9c9a3, roughness: 1, metalness: 0 });
            const edgeMat = new THREE.MeshStandardMaterial({ color: 0x3a5a40, roughness: 1, metalness: 0 });
            function makeTatami() {
                const g = new THREE.Group();
                const mat = new THREE.Mesh(new THREE.PlaneGeometry(0.92, 1.7), strawMat);
                mat.rotation.x = -Math.PI / 2; mat.receiveShadow = true; g.add(mat);
                [[0, 0.865, 0.98, 0.03], [0, -0.865, 0.98, 0.03]].forEach(([x, z, w, d]) => {
                    const e = solid(new THREE.Mesh(new THREE.BoxGeometry(w, 0.012, d), edgeMat));
                    e.position.set(x, 0.002, z); g.add(e);
                });
                [[-0.475, 0], [0.475, 0]].forEach(([x, z]) => {
                    const e = solid(new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.012, 1.76), edgeMat));
                    e.position.set(x, 0.002, z); g.add(e);
                });
                return g;
            }
            [[-0.47], [0.47]].forEach(([x]) => {
                const t = makeTatami(); t.position.set(x, 0.006, -0.15); inner.add(t);
            });

            // โต๊ะเตี้ยกลางห้อง (top สูง 0.325) + ถาดชา + ถ้วย 2 ใบ
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b5e3c, roughness: 0.7, metalness: 0 });
            const table = new THREE.Group();
            const top = solid(new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.05, 0.5), woodMat));
            top.position.y = 0.30; table.add(top);
            [[-0.33, -0.20], [0.33, -0.20], [-0.33, 0.20], [0.33, 0.20]].forEach(([x, z]) => {
                const leg = solid(new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.28, 0.05), woodMat));
                leg.position.set(x, 0.14, z); table.add(leg);
            });
            const tray = solid(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.02, 0.2),
                new THREE.MeshStandardMaterial({ color: 0x4a3525, roughness: 0.8 })));
            tray.position.y = 0.335; table.add(tray);
            const cupMat = new THREE.MeshStandardMaterial({ color: 0xf5efe2, roughness: 0.5 });
            [[-0.07], [0.07]].forEach(([x]) => {
                const cup = solid(new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.028, 0.06, 12), cupMat));
                cup.position.set(x, 0.375, 0); table.add(cup);
            });
            table.position.set(0, 0, -0.15);
            inner.add(table);

            // เบาะนั่ง 2 ใบ ซ้าย/ขวา (เหลือช่องห่างโต๊ะ ~6 ซม.)
            const cu1 = solid(new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.07, 0.42),
                new THREE.MeshStandardMaterial({ color: 0x3e5a7a, roughness: 1 })));
            cu1.position.set(-0.65, 0.045, -0.15); cu1.rotation.y = 0.05; inner.add(cu1);
            const cu2 = solid(new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.07, 0.42),
                new THREE.MeshStandardMaterial({ color: 0xd9c9a3, roughness: 1 })));
            cu2.position.set(0.65, 0.045, -0.15); cu2.rotation.y = -0.06; inner.add(cu2);

            // ชั้นวางเตี้ยหลังห้องซ้าย (สูง 0.35 ไม่บังป้าย) + หนังสือ 3 เล่ม + แจกัน
            const shelf = new THREE.Group();
            const shelfMat = new THREE.MeshStandardMaterial({ color: 0x6e4527, roughness: 0.8, metalness: 0 });
            [[0.035], [0.19], [0.345]].forEach(([y]) => {
                const board = solid(new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.03, 0.25), shelfMat));
                board.position.y = y; shelf.add(board);
            });
            [[-0.235], [0.235]].forEach(([x]) => {
                const side = solid(new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.34, 0.25), shelfMat));
                side.position.set(x, 0.19, 0); shelf.add(side);
            });
            const bookCols = [0x7a3b2e, 0x3e5a7a, 0x5a7d4f];
            bookCols.forEach((c, i) => {
                const bk = solid(new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.16, 0.12),
                    new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 })));
                bk.position.set(-0.15 + i * 0.05, 0.285, 0); bk.rotation.z = i === 2 ? -0.18 : 0; shelf.add(bk);
            });
            const vase = solid(new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.05, 0.12, 12),
                new THREE.MeshStandardMaterial({ color: 0x5a7d8a, roughness: 0.6 })));
            vase.position.set(0.14, 0.27, 0); shelf.add(vase);
            const sprig = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8),
                new THREE.MeshStandardMaterial({ color: 0x5a7d4f, roughness: 1 }));
            sprig.position.set(0.14, 0.36, 0); shelf.add(sprig);
            shelf.position.set(-0.65, 0, -1.0);
            inner.add(shelf);

            // โคมกระดาษห้อยเพดาน ครอบไฟดวงเดิม (0,1.55,0) ไม่ย้ายไฟ กันเพดานล้น
            // โคมไม่กาดเงา (ไฟดวงนี้ไม่กาดเงาอยู่แล้ว) ผิวเรืองแสงเบาๆ ให้เห็นว่าติดอยู่
            const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.33, 6),
                new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.8 }));
            cord.position.set(0, 1.845, 0); inner.add(cord);
            const shade = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12),
                new THREE.MeshStandardMaterial({
                    color: 0xfff6e8, emissive: 0xffe9c4, emissiveIntensity: 0.35,
                    roughness: 0.9, metalness: 0, side: THREE.DoubleSide
                }));
            shade.position.set(0, 1.55, 0); shade.scale.y = 0.85; inner.add(shade);
            const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.03, 10),
                new THREE.MeshStandardMaterial({ color: 0x6e4527, roughness: 0.8 }));
            cap.position.set(0, 1.69, 0); inner.add(cap);
        })();

        // ---------- debug ชั่วคราว: ตรวจว่ารูป decode ได้จริงไหม ----------
        console.log('BUILD 005, WebGL2=', renderer.capabilities.isWebGL2);
        window.__dbg = { texP, texPhoto, pPhotoMats };
        setTimeout(() => {
            console.log('DBG texP:', texP.image ? (texP.image.naturalWidth + 'x' + texP.image.naturalHeight) : 'NO IMAGE',
                '| texPhoto:', texPhoto.image ? (texPhoto.image.naturalWidth + 'x' + texPhoto.image.naturalHeight) : 'NO IMAGE');
        }, 3000);


        // ---------- ระบบเดินกล้องเข้า-ออกบ้าน ----------

        // จุดอ้างอิงภายนอก/ภายในบ้าน (วัดจากตำแหน่งจริงใน HOME.glb)
        // จุดข้างในบ้านเล็งไปที่กลางห้องเพื่อให้เห็นทั้งตัวอักษรที่พื้น รูปบนผนังขวา และกระจกสองข้าง
        const PATH_IN = [
            { pos: new THREE.Vector3(0, 1.1, 2.0), target: new THREE.Vector3(0, 1.1, 1.0), light: 0.8 },
            // ข้างในบ้านมองราบที่ผนังหลัง (เดิมก้มดูพื้น 13.2 องศาเพื่อเก็บป้ายที่ยืนพื้น
            // แต่ตอนนี้ป้ายอยู่บนผนังแล้ว ถ้ายังก้มอยู่ครึ่งล่างของภาพจะเป็นพื้นเปล่า)
            { pos: new THREE.Vector3(0, 1.3, 0.8), target: new THREE.Vector3(0, 1.3, -1.2), light: 0.8 }
        ];
        const PATH_OUT = [
            // ถอยกลางห้องแล้วหันหน้าเข้าหาประตูก่อน เผื่อผู้ใช้หันกล้องไว้คนละทิศตอนกดออก
            { pos: new THREE.Vector3(0, 1.3, 0.6), target: new THREE.Vector3(0, 1.2, 1.0), light: 0 },
            { pos: new THREE.Vector3(0, 1.1, 2.0), target: new THREE.Vector3(0, 1.1, 1.0), light: 0 },
            { pos: new THREE.Vector3(0, 2, 5), target: new THREE.Vector3(0, 0, 0), light: 0 }
        ];

        const btnExit = document.getElementById('btnExit');
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        let isInside = false;
        let pointerDownPos = null;

        // ไฟอุ่นข้างในบ้าน (ไม่กาดเงา จึงเปิด-ปิดพร้อมการเดินทางเพื่อไม่ให้แสงรั่วออกมานอกบ้าน)
        // ย้ายลงมาที่ระดับหัวโคม (1.62) ไม่ใช่ใกล้เพดาน เพราะที่ 1.95 ไฟอยู่ห่างเพดาน
        // หลังคาแค่ 0.87 ม. แสงจะตกลงเพดานหนักจนขาวล้น (วัดแล้ว E≈3.4 ตอน intensity 2.6)
        // สีไฟต้องเป็นโทนเย็น ไม่ใช่สีส้มอุ่น เพราะไฟสีส้มจะไปหักสีฟ้าของผนังจนกลายเป็นสีเทา
        // (วัดจากพิกเซลจริง: ไฟส้มได้ผนัง B-R=24 แต่ไฟฟ้าอ่อนได้ B-R=39 ที่ความสว่างเท่ากัน)
        const pointLightInside = new THREE.PointLight(0xd8ecff, 0, 4.5, 2);
        pointLightInside.position.set(0, 1.55, 0);
        scene.add(pointLightInside);

        const camAnim = {
            active: false,
            path: null,
            leg: 0,
            elapsed: 0,
            legDuration: 800,
            fromPos: new THREE.Vector3(),
            toPos: new THREE.Vector3(),
            fromTarget: new THREE.Vector3(),
            toTarget: new THREE.Vector3(),
            lightFrom: 0,
            lightTo: 0
        };

        const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

        // ข้างในบ้าน: หมุนดูรอบห้องได้อย่างเดียว เลยพันกล้องไว้ที่จุดเดิม
        // รัศมี 2.0 m (จากกล้องถึงเป้าหมายบนผนังหลัง) + ไม่ให้ซูม/แพน
        // ขอบเขตมุมคำนวณจากขนาดห้องจริง: ห้องกว้าง 2.0 m (ผนังข้างที่ x = ±1.0)
        // ถ้าหมุนเกิน 30 องศา (2*sin 30 = 1.0) กล้องจะพุ่งออกนอกผนัง จึงจำกัดไว้ที่ 26 องศา
        // ขอบบน/ล่างก็เผื่อชนเพดาน (สูงสุด 2.011) กับพื้น (0) ไว้ด้วย
        const INSIDE_RADIUS = 2.0;
        const INSIDE_AZIMUTH = 0.454;   // 26 องศา
        const INSIDE_POLAR = 0.22;      // 12.6 องศา

        function applyInsideLimits(inside) {
            if (inside) {
                controls.minDistance = INSIDE_RADIUS;
                controls.maxDistance = INSIDE_RADIUS;
                controls.minAzimuthAngle = -INSIDE_AZIMUTH;
                controls.maxAzimuthAngle = INSIDE_AZIMUTH;
                controls.minPolarAngle = Math.PI * 0.5 - INSIDE_POLAR;
                controls.maxPolarAngle = Math.PI * 0.5 + INSIDE_POLAR;
                controls.enableZoom = false;
                controls.enablePan = false;
            } else {
                controls.minDistance = 0;
                controls.maxDistance = Infinity;
                controls.minAzimuthAngle = -Infinity;
                controls.maxAzimuthAngle = Infinity;
                controls.minPolarAngle = 0;
                controls.maxPolarAngle = Math.PI;
                controls.enableZoom = true;
                controls.enablePan = true;
            }
        }

        function startLeg() {
            const leg = camAnim.path[camAnim.leg];
            camAnim.toPos.copy(leg.pos);
            camAnim.toTarget.copy(leg.target);
            camAnim.lightTo = leg.light;
        }

        function flyTo(path) {
            if (camAnim.active) return;
            camAnim.active = true;
            camAnim.path = path;
            camAnim.leg = 0;
            camAnim.elapsed = 0;
            camAnim.fromPos.copy(camera.position);
            camAnim.fromTarget.copy(controls.target);
            camAnim.lightFrom = pointLightInside.intensity;
            controls.enabled = false;
            startLeg();
        }

        function enterHouse() {
            if (camAnim.active) return;
            isInside = true;
            btnExit.style.display = 'block';
            flyTo(PATH_IN);
        }

        function goOutside() {
            if (camAnim.active) return;
            isInside = false;
            btnExit.style.display = 'none';
            renderer.domElement.style.cursor = 'default';
            // ปลด maxDistance ก่อนเดินออก ไม่ใช้นำ OrbitControls จะดึงกล้องกลับเข้ามาตอนเดินออก
            applyInsideLimits(false);
            flyTo(PATH_OUT);
        }

        // ยิงเรย์ใส่ทั้งบ้าน แล้วเอาเฉพาะกระสุนแรกสุด
        // ถ้ายิงแล้วโดนผนังก่อน แปลว่ามองไม่เห็นประตูจริง ๆ (เช่นอยู่ด้านหลังบ้าน) ก็จะไม่เข้า
        function isDoorHit(event) {
            if (!doorMesh || !homeModel) return false;
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            homeModel.updateMatrixWorld(true);
            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObject(homeModel, true);
            return hits.length > 0 && hits[0].object === doorMesh;
        }

        renderer.domElement.addEventListener('pointerdown', (event) => {
            pointerDownPos = { x: event.clientX, y: event.clientY };
        });

        renderer.domElement.addEventListener('pointerup', (event) => {
            if (!pointerDownPos) return;
            const moved = Math.hypot(event.clientX - pointerDownPos.x, event.clientY - pointerDownPos.y);
            pointerDownPos = null;
            if (moved > 5) return; // เป็นการลากหมุนกล้องด้วย OrbitControls ไม่ใช่การคลิก
            if (isInside) return; // ข้างในบ้านคลิกไม่ต้องทำอะไร
            if (isDoorHit(event)) enterHouse();
        });

        renderer.domElement.addEventListener('pointermove', (event) => {
            if (camAnim.active) return;
            renderer.domElement.style.cursor = !isInside && isDoorHit(event) ? 'pointer' : 'default';
        });

        btnExit.addEventListener('click', goOutside);


        let lastTime = performance.now();

        function animate(t) {
          //  mesh.rotation.y = Math.sin(t * 0.001);
            const now = t || performance.now();
            const delta = Math.min(now - lastTime, 100);
            lastTime = now;

            if (camAnim.active) {
                camAnim.elapsed += delta;
                const k = Math.min(camAnim.elapsed / camAnim.legDuration, 1);
                const e = easeInOutCubic(k);

                camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, e);
                controls.target.lerpVectors(camAnim.fromTarget, camAnim.toTarget, e);
                pointLightInside.intensity = camAnim.lightFrom + (camAnim.lightTo - camAnim.lightFrom) * e;

                if (k >= 1) {
                    camAnim.leg++;
                    if (camAnim.leg >= camAnim.path.length) {
                        camAnim.active = false;
                        // คืนการควบคุมกล้องให้ผู้ใช้หมุนดูรอบห้องได้
                        // (ระหว่างเดินทางเป็น false เพื่อไม่ให้เมาส์ไปสู้ภาพเคลื่อน)
                        controls.enabled = true;
                        applyInsideLimits(isInside);
                    } else {
                        camAnim.elapsed = 0;
                        camAnim.fromPos.copy(camera.position);
                        camAnim.fromTarget.copy(controls.target);
                        camAnim.lightFrom = pointLightInside.intensity;
                        startLeg();
                    }
                }
            }

            // ระหว่างเดินทางอย่าให้ OrbitControls มาทับตำแหน่งกล้อง (เหลือแรงหมุนค้างจากการลาก
            // ครั้งก่อน ถ้าเรียก update() กล้องจะกระตุกหนึ่งเฟรมตอนเริ่มเดิน)
            // พอเดินเสร็จ applyInsideLimits จะคุมมุมหมุนไว้ ไม่ให้กล้องหลุดออกผนังหรือทะลุพื้น
            if (!camAnim.active) controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && isInside) {
                goOutside();
            }
        });

    </script>
</body>

</html>
